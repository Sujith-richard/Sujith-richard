name: Chess Move Handler

on:
  issues:
    types: [opened]

jobs:
  process-chess-move:
    if: startsWith(github.event.issue.title, 'Chess:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process chess move
        uses: JonathanGautex/github-readme-chess@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          username: ${{ github.repository_owner }}

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.name,
              body: '✅ Move processed! The chess board has been updated.\n\n♟️ *Powered by [github-readme-chess](https://github.com/JonathanGautex/github-readme-chess)*'
            })
